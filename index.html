<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ec">
  <title>activ — running route generator</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root { --ink:#17251d; --muted:#68736c; --paper:#f5f3ec; --card:#fffef9; --green:#126b49; --lime:#c8f06b; --line:#dce1da; --shadow:0 18px 55px rgba(21,44,31,.13); }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; }
    body { font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:var(--paper); }
    button, input, select { font:inherit; }
    .shell { height:100%; display:grid; grid-template-columns:minmax(300px,390px) 1fr; }
    .panel { position:relative; z-index:500; padding:30px; overflow:auto; background:rgba(245,243,236,.96); border-right:1px solid rgba(23,37,29,.08); }
    .brand { display:flex; align-items:center; gap:11px; font-weight:800; letter-spacing:-.03em; font-size:20px; }
    .logo { width:34px; height:34px; display:grid; place-items:center; border-radius:50%; background:var(--ink); color:var(--lime); }
    h1 { margin:44px 0 10px; max-width:320px; font-family:Georgia,serif; font-size:43px; line-height:.98; letter-spacing:-.045em; font-weight:500; }
    .intro { color:var(--muted); line-height:1.55; margin:0 0 28px; }
    .location { width:100%; border:0; border-radius:15px; padding:15px 17px; background:var(--ink); color:white; font-weight:750; cursor:pointer; display:flex; justify-content:center; gap:9px; transition:.2s; }
    .location:hover { transform:translateY(-1px); background:#223d2e; }
    .location:disabled, .generate:disabled { cursor:not-allowed; opacity:.58; transform:none; }
    .location.ready { background:#e5eddf; color:var(--green); }
    .coords { min-height:20px; margin:9px 2px 19px; font-size:12px; color:var(--muted); text-align:center; }
    label { display:block; margin:18px 0 8px; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.09em; }
    .distance-wrap { display:flex; align-items:center; overflow:hidden; border:1px solid var(--line); background:var(--card); border-radius:14px; }
    .distance-wrap input { width:100%; border:0; outline:0; padding:14px 16px; color:var(--ink); background:transparent; font-weight:750; }
    .unit { padding-right:16px; color:var(--muted); font-size:13px; }
    select { width:100%; border:1px solid var(--line); outline:0; border-radius:14px; padding:14px 40px 14px 16px; color:var(--ink); background:var(--card); font-weight:700; }
    .preset-note { margin:8px 2px 0; color:var(--muted); font-size:12px; line-height:1.4; }
    .generate { width:100%; margin-top:25px; border:0; border-radius:15px; padding:16px; background:var(--green); color:white; font-weight:800; cursor:pointer; box-shadow:0 10px 25px rgba(18,107,73,.2); }
    .status { display:none; margin-top:16px; padding:13px 14px; border-radius:13px; background:#ebe9df; font-size:13px; line-height:1.45; }
    .status.show { display:block; }
    .status.error { background:#f7e5df; color:#8a301e; }
    .dev-panel { display:none; margin-top:12px; padding:12px 14px; border:1px dashed #9aa89f; border-radius:13px; color:var(--muted); font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; }
    .dev-panel.show { display:block; }
    .result { display:none; margin-top:16px; padding:17px; border:1px solid var(--line); border-radius:16px; background:var(--card); }
    .result.show { display:block; }
    .result-row { display:flex; align-items:end; justify-content:space-between; gap:15px; }
    .miles { font-family:Georgia,serif; font-size:36px; line-height:1; }
    .miles small { font-family:inherit; font-size:16px; color:var(--muted); }
    .match { text-align:right; color:var(--muted); font-size:12px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:15px; padding-top:14px; border-top:1px solid var(--line); }
    .stat { min-width:0; }
    .stat strong { display:block; font-size:14px; }
    .stat span { display:block; margin-top:3px; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.06em; }
    .map-wrap { position:relative; min-height:420px; }
    #map { position:absolute; inset:0; background:#dfe5dc; }
    .map-hint { position:absolute; z-index:450; top:20px; left:50%; transform:translateX(-50%); padding:10px 14px; border-radius:999px; background:rgba(255,254,249,.92); box-shadow:0 5px 20px rgba(0,0,0,.08); font-size:12px; color:var(--muted); pointer-events:none; white-space:nowrap; }
    .start-marker { width:22px!important; height:22px!important; margin:-11px!important; border:5px solid white; border-radius:50%; background:var(--green); box-shadow:0 2px 10px rgba(0,0,0,.3); }
    .leaflet-control-attribution { font-size:10px; }
    @media (max-width:760px) { .shell{display:flex; flex-direction:column;} .panel{padding:22px 20px; border:0;} h1{margin-top:25px;font-size:37px;} .map-wrap{min-height:52vh; flex:1;} }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="brand"><span class="logo">↗</span> activ</div>
      <h1>A better loop starts here.</h1>
      <p class="intro">Pick your distance and what matters today. We’ll find a runnable loop from your doorstep.</p>

      <button id="locate" class="location"><span>◎</span><span>Use my location</span></button>
      <div id="coords" class="coords">Your location stays in this browser.</div>

      <label for="distance">Distance</label>
      <div class="distance-wrap"><input id="distance" type="number" value="3" min="0.5" max="20" step="0.5" inputmode="decimal"><span class="unit">miles</span></div>

      <label for="preset">Route style</label>
      <select id="preset">
        <option value="balanced">Balanced</option>
        <option value="nature">Nature Loop</option>
        <option value="nostops">No Stops</option>
        <option value="scenic">Scenic</option>
      </select>
      <p id="presetNote" class="preset-note">A practical mix of direct streets and pleasant paths.</p>

      <button id="generate" class="generate" disabled>Generate my loop</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="devPanel" class="dev-panel" aria-live="polite"></div>
      <div id="result" class="result">
        <div class="result-row"><div class="miles"><span id="actual">—</span> <small>mi</small></div><div id="match" class="match"></div></div>
        <div class="stats">
          <div class="stat"><strong id="greenStat">—</strong><span>Green route</span></div>
          <div class="stat"><strong id="crossingStat">—</strong><span>Crossings</span></div>
          <div class="stat"><strong id="repeatStat">—</strong><span>Repeated</span></div>
        </div>
      </div>
    </section>
    <section class="map-wrap">
      <div class="map-hint">Your route will appear here</div>
      <div id="map" aria-label="Running route map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    'use strict';
    const M_PER_MI = 1609.344;
    const state = { location:null, routeLayer:null, marker:null, timings:{}, cacheSource:'' };
    const $ = id => document.getElementById(id);
    const map = L.map('map', { zoomControl:false }).setView([40, -98], 4);
    L.control.zoom({position:'bottomright'}).addTo(map);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap contributors' }).addTo(map);

    const presetCopy = {
      balanced:'A practical mix of direct streets and pleasant paths.',
      nature:'Prefers paths through parks, gardens, and forests.',
      nostops:'Avoids traffic signals and marked crossings where possible.',
      scenic:'Seeks greenery, water, and varied terrain when mapped.'
    };
    $('preset').addEventListener('change', e => $('presetNote').textContent = presetCopy[e.target.value]);
    $('locate').addEventListener('click', locate);
    $('generate').addEventListener('click', generate);
    // Deterministic QA hook. Supplying ?testLat=...&testLon=... bypasses
    // geolocation prompts without adding controls to the production UI.
    const testParams=new URLSearchParams(location.search),testLat=Number(testParams.get('testLat')),testLon=Number(testParams.get('testLon'));
    const devMode=testParams.has('debug')||testParams.get('qa')==='1';
    if(testParams.has('testLat')&&testParams.has('testLon')&&Number.isFinite(testLat)&&Number.isFinite(testLon)){
      state.location={lat:testLat,lon:testLon};$('generate').disabled=false;
      $('locate').classList.add('ready');$('locate').innerHTML='<span>✓</span><span>Test location ready</span>';
      $('coords').textContent=`${testLat.toFixed(4)}, ${testLon.toFixed(4)} · test coordinates`;
      state.marker=L.marker([testLat,testLon],{icon:L.divIcon({className:'start-marker',html:''})}).addTo(map);map.setView([testLat,testLon],15);
    }

    function status(message, error=false) {
      $('status').textContent = message;
      $('status').className = 'status show' + (error ? ' error' : '');
    }
    function clearStatus(){ $('status').className='status'; }
    function mark(name,start){ state.timings[name]=Math.round(performance.now()-start); renderTimings(); }
    function renderTimings(extra=''){
      if(!devMode)return;
      const lines=Object.entries(state.timings).map(([name,ms])=>`${name}: ${ms} ms`);
      if(state.cacheSource)lines.push(`map data: ${state.cacheSource}`);
      if(extra)lines.push(extra);
      $('devPanel').textContent=lines.join('\n');$('devPanel').className='dev-panel show';
    }
    function locate() {
      if (!navigator.geolocation) return status('This browser does not support location sharing.', true);
      $('locate').disabled=true; $('locate').innerHTML='<span>◌</span><span>Finding you…</span>'; clearStatus();
      navigator.geolocation.getCurrentPosition(pos => {
        const {latitude:lat, longitude:lon} = pos.coords;
        state.location={lat,lon};
        $('locate').disabled=false; $('locate').classList.add('ready'); $('locate').innerHTML='<span>✓</span><span>Location ready</span>';
        $('coords').textContent=`${lat.toFixed(4)}, ${lon.toFixed(4)} · accuracy ±${Math.round(pos.coords.accuracy)} m`;
        $('generate').disabled=false;
        if (state.marker) map.removeLayer(state.marker);
        state.marker=L.marker([lat,lon],{icon:L.divIcon({className:'start-marker',html:''})}).addTo(map).bindTooltip('Start / finish');
        map.setView([lat,lon],15); clearStatus();
      }, err => {
        $('locate').disabled=false; $('locate').innerHTML='<span>◎</span><span>Try location again</span>';
        const msg=err.code===1?'Location access was denied. Enable it in your browser settings and try again.':'We could not get your location. Check your connection and try again.';
        status(msg,true);
      }, {enableHighAccuracy:true,timeout:12000,maximumAge:60000});
    }

    async function generate() {
      if (!state.location) return status('Share your location first.',true);
      const miles=Number($('distance').value);
      if (!Number.isFinite(miles)||miles<.5||miles>20) return status('Choose a distance from 0.5 to 20 miles.',true);
      $('generate').disabled=true; $('result').className='result';
      try {
        state.timings={}; const totalStart=performance.now();
        status('Asking the activ server to build your loop…');
        const loadStart=performance.now();
        const response=await fetch('/api/routes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({latitude:state.location.lat,longitude:state.location.lon,distanceMiles:miles,preset:$('preset').value})});
        const result=await response.json();
        if(!response.ok)throw new Error(result.error||'The activ server could not generate a route.');
        mark('server request',loadStart);state.cacheSource=result.meta?.mapSource||'server';
        if (!result.coordinates || result.coordinates.length<2) throw new Error('The server returned an incomplete route.');
        drawRoute(result.coordinates);
        const actual=result.distanceMiles;
        const delta=Math.round(Math.abs(actual-miles)/miles*100);
        $('actual').textContent=actual.toFixed(2);
        $('match').innerHTML=delta<=15?`${presetLabel()}<br>within ${delta}% of target`:`${presetLabel()}<br>${delta}% from target`;
        $('greenStat').textContent=`${result.stats.greenPercent}%`;
        $('crossingStat').textContent=String(result.stats.crossings);
        $('repeatStat').textContent=`${result.stats.repeatedPercent}%`;
        $('result').className='result show';
        status(delta<=15?'Loop ready. Have a great run.':'Closest loop found — actual distance shown below.');
        mark('total',totalStart);
      } catch(err) { console.error(err); status(err.message||'Something went wrong while generating the route.',true); }
      finally { $('generate').disabled=false; }
    }
    const presetLabel=()=>$('preset').options[$('preset').selectedIndex].text;

    function bboxFor(target) {
      // A compact box is dramatically faster in dense cities and still leaves
      // enough margin around the ideal loop radius for route adjustments.
      const radius=Math.max(700,target/(2*Math.PI)*1.12);
      const lat=state.location.lat, lon=state.location.lon;
      const dLat=radius/111320, dLon=radius/(111320*Math.max(.2,Math.cos(lat*Math.PI/180)));
      return {s:lat-dLat,w:lon-dLon,n:lat+dLat,e:lon+dLon,radius};
    }
    async function loadNetwork(target) {
      const b=bboxFor(target), key=[b.s,b.w,b.n,b.e].map(x=>x.toFixed(3)).join(',');
      if(state.graph&&state.dataKey===key){state.cacheSource='memory cache';return state.graph;}
      const box=`${b.s},${b.w},${b.n},${b.e}`;
      // Keep the route-critical road query small. Scenery and crossing data is
      // fetched independently; a slow enrichment must never prevent a route.
      const roadQuery=`[out:json][timeout:22];way[highway~"^(footway|path|residential|living_street|pedestrian|tertiary|secondary|unclassified|service|track|steps)$"][foot!="no"][access!="private"](${box});out geom;`;
      const featureQuery=`[out:json][timeout:12];(way[leisure~"^(park|garden)$"](${box});way[landuse="forest"](${box});way[natural="water"](${box});way[waterway~"^(river|stream|canal)$"](${box});node[highway="traffic_signals"](${box});node[crossing](${box}););out geom;`;
      const enrichment=fetchOverpassCached(featureQuery,'features',{timeout:12000,quiet:true}).catch(err=>{console.warn('Optional map enrichment unavailable:',err.message);return null;});
      const roadJson=await fetchOverpassCached(roadQuery,'roads');
      let elements=roadJson.elements;
      status('Roads loaded — checking parks and crossings…');
      const featureJson=await Promise.race([enrichment,new Promise(resolve=>setTimeout(()=>resolve(null),2500))]);
      if(featureJson)elements=elements.concat(featureJson.elements);
      state.graph=buildGraph(elements); state.dataKey=key;
      if(state.graph.nodes.size<10) throw new Error('Not enough runnable paths were found near this location.');
      return state.graph;
    }

    function hashString(value){let h=2166136261;for(let i=0;i<value.length;i++){h^=value.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}
    function openMapCache(){
      if(!('indexedDB' in window))return Promise.resolve(null);
      if(!mapCachePromise)mapCachePromise=new Promise(resolve=>{const request=indexedDB.open('activ-map-cache',CACHE_VERSION);request.onupgradeneeded=()=>request.result.createObjectStore('responses',{keyPath:'key'});request.onsuccess=()=>resolve(request.result);request.onerror=()=>{console.warn('Map cache unavailable:',request.error);resolve(null);};});
      return mapCachePromise;
    }
    const idbRequest=request=>new Promise((resolve,reject)=>{request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});
    const idbDone=tx=>new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});
    async function readCache(key){
      try{const db=await openMapCache();if(!db)return null;const item=await idbRequest(db.transaction('responses').objectStore('responses').get(key));if(!item)return null;if(!item.ts||Date.now()-item.ts>CACHE_TTL||!item.data?.elements){await deleteCache(key);return null;}return item.data;}catch(err){console.warn('Map cache read failed:',err);return null;}
    }
    async function deleteCache(key){const db=await openMapCache();if(!db)return;const tx=db.transaction('responses','readwrite');tx.objectStore('responses').delete(key);await idbDone(tx);}
    async function writeCache(key,data){
      try{
        const db=await openMapCache();if(!db)return;let tx=db.transaction('responses','readwrite');tx.objectStore('responses').put({key,ts:Date.now(),data});await idbDone(tx);
        const entries=await idbRequest(db.transaction('responses').objectStore('responses').getAll());
        for(const item of entries.sort((a,b)=>b.ts-a.ts).slice(MAX_CACHE_ENTRIES))await deleteCache(item.key);
      }catch(err){console.warn('Map cache write skipped:',err);}
    }
    async function fetchOverpassCached(query,kind,options={}){
      const key=CACHE_PREFIX+kind+':'+hashString(query),cached=await readCache(key);
      if(cached){state.cacheSource=`browser cache (${kind})`;return cached;}
      const data=await fetchOverpass(query,options);await writeCache(key,data);state.cacheSource=`live Overpass (${kind})`;return data;
    }

    function fetchOverpass(query,options={}) {
      // Start backups shortly after the primary instead of waiting up to 30s
      // for each one in sequence. The first valid response wins.
      return new Promise((resolve,reject)=>{
        const controllers=[], failures=[]; let finished=0, settled=false;
        OVERPASS_ENDPOINTS.forEach((endpoint,i)=>setTimeout(async()=>{
          if(settled)return;
          if(i===1&&!options.quiet)status('The first map server is slow — trying alternate capacity…');
          if(i===2&&!options.quiet)status('The standard servers are busy — trying an independent backup…');
          const controller=new AbortController(); controllers.push(controller);
          const timer=setTimeout(()=>controller.abort(),options.timeout||30000);
          try {
            // Form-encoded POST is the transport documented by Overpass. GET
            // requests are rejected with HTTP 406 by the standard instance.
            const response=await fetch(endpoint,{method:'POST',mode:'cors',cache:'no-store',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(query),signal:controller.signal});
            if(!response.ok)throw new Error(`HTTP ${response.status}`);
            const json=await response.json();
            if(!json.elements)throw new Error('invalid response');
            if(!settled){settled=true;controllers.forEach(c=>c!==controller&&c.abort());resolve(json);}
          } catch(err) {
            failures[i]=err.name==='AbortError'?'timed out':err.message;
            finished++;
            if(finished===OVERPASS_ENDPOINTS.length&&!settled){console.warn('Overpass attempts failed:',failures);reject(new Error(`Could not load map data (${failures.join('; ')}).`));}
          } finally {clearTimeout(timer);}
        },i*1500));
      });
    }

    function buildGraph(elements) {
      const allNodes=new Map(), roadWays=[], areas=[], crossings=[];
      for(const el of elements) if(el.type==='node'&&el.lat!=null) allNodes.set(el.id,{id:el.id,lat:el.lat,lon:el.lon,ele:Number(el.tags&&el.tags.ele)});
      // Ways returned with `out geom` carry coordinates alongside their node IDs.
      for(const el of elements)if(el.type==='way'&&el.nodes&&el.geometry)for(let i=0;i<el.nodes.length;i++){
        const p=el.geometry[i];if(p&&!allNodes.has(el.nodes[i]))allNodes.set(el.nodes[i],{id:el.nodes[i],lat:p.lat,lon:p.lon,ele:NaN});
      }
      for(const el of elements) {
        if(el.type==='node'&&el.tags&&(el.tags.crossing||el.tags.highway==='traffic_signals')) crossings.push(allNodes.get(el.id));
        if(el.type!=='way'||!el.nodes) continue;
        const t=el.tags||{};
        if(t.highway) roadWays.push(el);
        else if(t.leisure||t.landuse==='forest'||t.natural==='water'||t.waterway) areas.push({kind:(t.natural==='water'||t.waterway)?'water':'green', points:el.nodes.map(id=>allNodes.get(id)).filter(Boolean)});
      }
      const nodes=new Map(), adj=new Map();
      const crossGrid=new Map(), cell=.001;
      for(const c of crossings)if(c){const k=`${Math.floor(c.lat/cell)},${Math.floor(c.lon/cell)}`;(crossGrid.get(k)||crossGrid.set(k,[]).get(k)).push(c);}
      const indexedAreas=areas.map(area=>({...area,minLat:Math.min(...area.points.map(p=>p.lat)),maxLat:Math.max(...area.points.map(p=>p.lat)),minLon:Math.min(...area.points.map(p=>p.lon)),maxLon:Math.max(...area.points.map(p=>p.lon))}));
      const addEdge=(a,b,meta)=>{ if(!adj.has(a.id))adj.set(a.id,[]); adj.get(a.id).push({to:b.id,...meta}); };
      for(const way of roadWays) for(let i=1;i<way.nodes.length;i++) {
        const a=allNodes.get(way.nodes[i-1]), b=allNodes.get(way.nodes[i]); if(!a||!b)continue;
        nodes.set(a.id,a); nodes.set(b.id,b); const distance=haversine(a,b); const key=a.id<b.id?`${a.id}-${b.id}`:`${b.id}-${a.id}`;
        const mid={lat:(a.lat+b.lat)/2,lon:(a.lon+b.lon)/2};
        const cy=Math.floor(mid.lat/cell),cx=Math.floor(mid.lon/cell);let nearbyCrossings=[];
        for(let y=cy-1;y<=cy+1;y++)for(let x=cx-1;x<=cx+1;x++)nearbyCrossings.push(...(crossGrid.get(`${y},${x}`)||[]));
        const crossingIds=nearbyCrossings.filter(c=>haversine(mid,c)<35).map(c=>c.id),nearCross=crossingIds.length>0;
        let green=false,water=false;
        for(const area of indexedAreas) { const pad=.0005;if(mid.lat<area.minLat-pad||mid.lat>area.maxLat+pad||mid.lon<area.minLon-pad||mid.lon>area.maxLon+pad)continue;if(featureNear(mid,area.points,area.kind==='water'?45:25)){if(area.kind==='water')water=true;else green=true;} }
        const climb=Number.isFinite(a.ele)&&Number.isFinite(b.ele)?Math.abs(a.ele-b.ele):0;
        const tags=way.tags||{};
        const meta={distance,key,nearCross,crossingIds,green,water,climb,highway:tags.highway,surface:tags.surface||'',sidewalk:tags.sidewalk||'',lit:tags.lit||''};
        addEdge(a,b,meta); addEdge(b,a,meta);
      }
      return {nodes,adj};
    }
    function featureNear(p,pts,buffer) {
      if(pts.length<2)return false;
      if(pts.length>2&&pointInPolygon(p,pts))return true;
      for(let i=1;i<pts.length;i++) if(pointSegmentDistance(p,pts[i-1],pts[i])<buffer)return true;
      return false;
    }
    function pointInPolygon(p,poly){ let inside=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if(((a.lat>p.lat)!==(b.lat>p.lat))&&(p.lon<(b.lon-a.lon)*(p.lat-a.lat)/(b.lat-a.lat)+a.lon))inside=!inside;} return inside; }
    function pointSegmentDistance(p,a,b){ const lat0=p.lat*Math.PI/180, x=q=>(q.lon-p.lon)*111320*Math.cos(lat0), y=q=>(q.lat-p.lat)*111320; const ax=x(a),ay=y(a),bx=x(b),by=y(b),dx=bx-ax,dy=by-ay; const t=Math.max(0,Math.min(1,-(ax*dx+ay*dy)/(dx*dx+dy*dy||1))); return Math.hypot(ax+t*dx,ay+t*dy); }
    function haversine(a,b){ const R=6371000, p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,dp=(b.lat-a.lat)*Math.PI/180,dl=(b.lon-a.lon)*Math.PI/180; const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
    function destination(origin,meters,bearing){
      const R=6371000,d=meters/R,t=bearing*Math.PI/180,p1=origin.lat*Math.PI/180,l1=origin.lon*Math.PI/180;
      const p2=Math.asin(Math.sin(p1)*Math.cos(d)+Math.cos(p1)*Math.sin(d)*Math.cos(t));
      const l2=l1+Math.atan2(Math.sin(t)*Math.sin(d)*Math.cos(p1),Math.cos(d)-Math.sin(p1)*Math.sin(p2));
      return {lat:p2*180/Math.PI,lon:l2*180/Math.PI};
    }

    function nearestNode(graph,p){ let best=null,bd=Infinity; for(const n of graph.nodes.values()){const d=haversine(p,n);if(d<bd){bd=d;best=n;}} return best; }
    function findLoop(graph,target,preset) {
      const start=nearestNode(graph,state.location); if(!start)return null;
      let radius=target/(2*Math.PI), best=null;
      for(let attempt=0;attempt<3;attempt++) {
        let ringBest=null;
        for(const rotation of [12,35,58,81]) {
          const candidate=buildCandidate(graph,start,target,radius,rotation+attempt*9,preset);
          if(candidate&&(!ringBest||candidate.score<ringBest.score))ringBest=candidate;
          if(candidate&&(!best||candidate.score<best.score))best=candidate;
        }
        if(ringBest){
          const error=Math.abs(ringBest.distance-target)/target,repeat=ringBest.stats.repeatedMeters/ringBest.distance;
          if(error<=.12&&repeat<=.16)break;
          radius*=Math.max(.7,Math.min(1.38,target/ringBest.distance));
        } else radius*=.78;
      }
      return best;
    }
    function buildCandidate(graph,start,target,radius,rotation,preset){
      const count=4,waypoints=[start];
      for(let i=0;i<count;i++)waypoints.push(nearestNode(graph,destination(state.location,radius,rotation+i*360/count)));
      waypoints.push(start);
      const used=new Set(),ids=[],metas=[];let total=0,repeatedMeters=0;
      for(let i=1;i<waypoints.length;i++){
        if(!waypoints[i-1]||!waypoints[i]||waypoints[i-1].id===waypoints[i].id)continue;
        const path=dijkstra(graph,waypoints[i-1].id,waypoints[i].id,preset,used);if(!path)return null;
        if(ids.length)path.ids.shift();ids.push(...path.ids);total+=path.distance;
        for(const edge of path.edgeMetas){if(used.has(edge.key))repeatedMeters+=edge.distance;used.add(edge.key);metas.push(edge);}
      }
      if(ids.length<3||!total)return null;
      const greenMeters=metas.reduce((sum,e)=>sum+(e.green?e.distance:0),0);
      const crossingSegments=new Set(metas.flatMap(e=>e.crossingIds||[])).size;
      const error=Math.abs(total-target)/target,repeatRatio=repeatedMeters/total;
      return {coords:ids.map(id=>[graph.nodes.get(id).lat,graph.nodes.get(id).lon]),distance:total,score:error*5+repeatRatio*4,stats:{greenMeters,crossingSegments,repeatedMeters}};
    }
    function edgeCost(e,preset,reused){
      let factor=1;
      if(e.highway==='secondary')factor*=e.sidewalk&&e.sidewalk!=='no'?1.55:2.8;
      else if(e.highway==='tertiary')factor*=e.sidewalk&&e.sidewalk!=='no'?1.15:1.5;
      else if(e.highway==='service')factor*=1.12;
      else if(e.highway==='steps')factor*=1.65;
      if(['footway','path','pedestrian','living_street'].includes(e.highway))factor*=.88;
      if(e.surface==='cobblestone'||e.surface==='sett')factor*=1.2;
      if(e.nearCross)factor*=preset==='nostops'?6:1.12;
      if(preset==='nature'){if(e.green)factor*=.4;if(e.highway==='path'||e.highway==='footway')factor*=.78;}
      if(preset==='scenic'){if(e.green)factor*=.55;if(e.water)factor*=.48;if(e.climb>1)factor*=.86;if(e.highway==='path'||e.highway==='footway')factor*=.86;}
      if(preset==='balanced'&&e.green)factor*=.88;
      if(reused)factor*=12;
      return Math.max(e.distance*.2,e.distance*factor);
    }
    function dijkstra(graph,start,goal,preset,used) {
      const dist=new Map([[start,0]]), prev=new Map(), heap=new MinHeap(); heap.push([0,start]);
      while(heap.size){const [cost,id]=heap.pop();if(cost!==dist.get(id))continue;if(id===goal)break;for(const e of graph.adj.get(id)||[]){const nc=cost+edgeCost(e,preset,used.has(e.key));if(nc<(dist.get(e.to)??Infinity)){dist.set(e.to,nc);prev.set(e.to,{id,edge:e});heap.push([nc,e.to]);}}}
      if(!prev.has(goal))return null;const ids=[goal],edgeMetas=[];let cur=goal,actual=0;while(cur!==start){const p=prev.get(cur);if(!p)return null;actual+=p.edge.distance;edgeMetas.push(p.edge);cur=p.id;ids.push(cur);}ids.reverse();edgeMetas.reverse();return {ids,distance:actual,edgeMetas};
    }
    class MinHeap { constructor(){this.a=[];} get size(){return this.a.length;} push(x){let i=this.a.push(x)-1;while(i){let p=(i-1)>>1;if(this.a[p][0]<=x[0])break;this.a[i]=this.a[p];i=p;}this.a[i]=x;} pop(){const root=this.a[0],last=this.a.pop();if(this.a.length){let i=0;this.a[0]=last;while(true){let l=i*2+1,r=l+1,s=i;if(l<this.a.length&&this.a[l][0]<this.a[s][0])s=l;if(r<this.a.length&&this.a[r][0]<this.a[s][0])s=r;if(s===i)break;[this.a[i],this.a[s]]=[this.a[s],this.a[i]];i=s;}}return root;} }
    function drawRoute(coords){ if(state.routeLayer)map.removeLayer(state.routeLayer);state.routeLayer=L.polyline(coords,{color:'#126b49',weight:7,opacity:.95,lineCap:'round',lineJoin:'round'}).addTo(map);state.routeLayer.bindTooltip('Your running loop');map.fitBounds(state.routeLayer.getBounds(),{padding:[45,45]});document.querySelector('.map-hint').style.display='none'; }

    function makeQaFixture(lat=-34.593,lon=-58.38){
      const elements=[],ids=[],size=17,step=.001;
      for(let y=0;y<size;y++){ids[y]=[];for(let x=0;x<size;x++){const id=10000+y*size+x,p={type:'node',id,lat:lat+(y-8)*step,lon:lon+(x-8)*step};ids[y][x]=id;elements.push(p);}}
      let wayId=20000;
      for(let y=0;y<size;y++)elements.push({type:'way',id:wayId++,nodes:ids[y],geometry:ids[y].map(id=>{const p=elements[id-10000];return {lat:p.lat,lon:p.lon};}),tags:{highway:y%4===0?'tertiary':'residential',sidewalk:'yes'}});
      for(let x=0;x<size;x++){const col=ids.map(row=>row[x]);elements.push({type:'way',id:wayId++,nodes:col,geometry:col.map(id=>{const p=elements[id-10000];return {lat:p.lat,lon:p.lon};}),tags:{highway:x%3===0?'footway':'residential'}});}
      for(const [y,x] of [[8,8],[4,8],[12,8]]){const p=elements[ids[y][x]-10000];p.tags={crossing:'marked'};}
      const parkIds=[ids[5][5],ids[5][11],ids[11][11],ids[11][5],ids[5][5]];
      elements.push({type:'way',id:wayId++,nodes:parkIds,geometry:parkIds.map(id=>{const p=elements[id-10000];return {lat:p.lat,lon:p.lon};}),tags:{leisure:'park'}});
      return elements;
    }
    async function runQaSuite(){
      const started=performance.now(),origin={lat:-34.593,lon:-58.38};state.location=origin;state.cacheSource='built-in fixture (no network)';
      const fixtureStart=performance.now(),graph=buildGraph(makeQaFixture(origin.lat,origin.lon));state.timings['fixture graph']=Math.round(performance.now()-fixtureStart);
      const cacheKey=CACHE_PREFIX+'qa-smoke',cacheData={elements:[{type:'node',id:1,lat:origin.lat,lon:origin.lon}]};await writeCache(cacheKey,cacheData);const cachePass=(await readCache(cacheKey))?.elements?.[0]?.id===1;await deleteCache(cacheKey);
      const target=3*M_PER_MI,checks={};
      for(const preset of ['balanced','nature','nostops','scenic']){const t=performance.now(),route=findLoop(graph,target,preset),error=route?Math.abs(route.distance-target)/target:1;checks[preset]={pass:!!route&&error<=.2&&route.coords.length>2,errorPct:Math.round(error*100),distanceMi:route?Number((route.distance/M_PER_MI).toFixed(2)):null,repeatedPct:route?Math.round(route.stats.repeatedMeters/route.distance*100):null,ms:Math.round(performance.now()-t)};}
      const pass=cachePass&&Object.values(checks).every(x=>x.pass);state.timings['QA total']=Math.round(performance.now()-started);window.__ACTIV_QA__={pass,cachePass,checks,nodeCount:graph.nodes.size,timings:{...state.timings}};
      status(pass?'Fast routing and cache checks passed.':'One or more fast checks failed.',!pass);renderTimings(`cache: ${cachePass?'PASS':'FAIL'}\n`+Object.entries(checks).map(([p,x])=>`${p}: ${x.pass?'PASS':'FAIL'} · ${x.distanceMi??'—'} mi · ${x.ms} ms`).join('\n'));
      document.title=`${pass?'PASS':'FAIL'} — activ QA`;
    }
    if(testParams.get('qa')==='1')setTimeout(runQaSuite,0);
  </script>
